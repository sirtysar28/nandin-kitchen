<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Nandin Kitchen</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #faf5ee; color: #4a2f24; text-align: center; padding: 24px;
    }
    .emoji { font-size: 72px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: #7b5e52; max-width: 420px; line-height: 1.6; }
    button {
      margin-top: 16px; background: #c68a4b; color: #fff; border: 0; padding: 12px 28px;
      border-radius: 999px; font-weight: 700; font-size: 15px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <div class="emoji">🧁</div>
    <h1>Koneksi terputus</h1>
    <p>Sebagian halaman Nandin Kitchen tetap tersimpan di perangkatmu, namun katalog, pemesanan, dan pembayaran membutuhkan koneksi internet. Coba periksa jaringanmu lalu muat ulang.</p>
    <button onclick="location.reload()">Muat Ulang</button>
  </div>
</body>
</html>
